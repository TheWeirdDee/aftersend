name: CI

# Everything here runs without provider credentials: speech comes from the labelled test-tone provider.
# The live AssemblyAI smoke test is a separate, manual job that spends real credits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Also run the live AssemblyAI smoke test (spends credits; needs the ASSEMBLYAI_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  live-speech-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: provider-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tts:smoke -- --runs 1
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
