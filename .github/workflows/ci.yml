name: CI

# Everything here runs without provider credentials: speech comes from the labelled test-tone provider.
# The live AssemblyAI smoke test is a separate, manual job that spends real credits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Also run the live AssemblyAI smoke test (spends credits; needs the ASSEMBLYAI_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A real Postgres for the concurrent-migration test; everything else uses the embedded one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npx next build
      # Firefox and WebKit run the cross-browser playback spec; WebKit here is the closest CI gets to Safari.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --project=desktop --project=mobile --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  live-speech-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: provider-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tts:smoke -- --runs 1
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
